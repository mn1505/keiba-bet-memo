<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f6f4a">
  <meta name="description" content="競馬の買い目をスマホに保存できるメモアプリです。">
  <title>買い目メモ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>買い目メモ</h1>
      <p>購入予定・購入済みの買い目をローカルに記録できます。</p>
    </div>
  </header>

  <main class="app-layout">
    <section class="form-section" aria-labelledby="form-title">
      <h2 id="form-title">買い目を登録</h2>

      <form id="bet-form">
        <div class="form-grid">
          <label>
            日付
            <input type="date" id="date" required>
          </label>

          <label>
            競馬場
            <input type="text" id="place" placeholder="例：東京、京都、大井" required>
          </label>

          <label>
            レース番号・レース名
            <input type="text" id="race" placeholder="例：東京11R、天皇賞・春" required>
          </label>

          <label>
            券種
            <select id="ticket-type" required>
              <option value="">選択してください</option>
              <option value="単勝">単勝</option>
              <option value="複勝">複勝</option>
              <option value="ワイド">ワイド</option>
              <option value="馬連">馬連</option>
              <option value="馬単">馬単</option>
              <option value="三連複">三連複</option>
              <option value="三連単">三連単</option>
            </select>
          </label>

          <label>
            買い目
            <input type="text" id="bet-numbers" placeholder="例：7、7-13、7→13" required>
          </label>

          <label>
            金額
            <input type="number" id="amount" min="100" step="100" placeholder="例：1000" required>
          </label>
        </div>

        <label>
          メモ
          <textarea id="memo" rows="3" placeholder="例：本命寄り、穴狙い、保険"></textarea>
        </label>

        <button type="submit" class="primary-button">登録する</button>
      </form>
    </section>

    <section class="list-section" aria-labelledby="list-title">
      <div class="list-header">
        <div>
          <h2 id="list-title">登録した買い目</h2>
          <p id="bet-count">0件</p>
        </div>
        <div class="list-actions">
          <button type="button" id="export-csv" class="export-button">表示中のデータをCSV出力</button>
          <div class="summary-box" aria-label="集計">
            <p>購入：<span id="total-amount">0</span>円</p>
            <p>払戻：<span id="total-payout">0</span>円</p>
            <p>収支：<span id="profit-loss">0</span>円</p>
            <p>回収率：<span id="recovery-rate">0.0</span>%</p>
          </div>
        </div>
      </div>
      <p id="csv-message" class="csv-message" aria-live="polite"></p>

      <section class="backup-section" aria-labelledby="backup-title">
        <h2 id="backup-title">バックアップ/復元</h2>
        <div class="backup-grid">
          <button type="button" id="export-backup" class="backup-button">全データをJSONバックアップ</button>

          <div class="restore-controls">
            <label>
              復元ファイル
              <input type="file" id="restore-file" accept="application/json,.json">
            </label>

            <label>
              復元方式
              <select id="restore-mode">
                <option value="replace">現在のデータを置き換える</option>
                <option value="append">現在のデータに追加する</option>
              </select>
            </label>

            <button type="button" id="restore-backup" class="secondary-button">JSONバックアップを復元</button>
          </div>
        </div>
        <p id="backup-message" class="backup-message" aria-live="polite"></p>
      </section>

      <section class="filter-section" aria-labelledby="filter-title">
        <div class="filter-header">
          <h2 id="filter-title">絞り込み</h2>
          <button type="button" id="reset-filters" class="secondary-button">リセット</button>
        </div>

        <div class="filter-grid">
          <label>
            日付
            <input type="date" id="filter-date">
          </label>

          <label>
            競馬場
            <select id="filter-place">
              <option value="">すべて</option>
            </select>
          </label>

          <label>
            券種
            <select id="filter-ticket-type">
              <option value="">すべて</option>
              <option value="単勝">単勝</option>
              <option value="複勝">複勝</option>
              <option value="ワイド">ワイド</option>
              <option value="馬連">馬連</option>
              <option value="馬単">馬単</option>
              <option value="三連複">三連複</option>
              <option value="三連単">三連単</option>
            </select>
          </label>

          <label>
            結果
            <select id="filter-status">
              <option value="">すべて</option>
              <option value="未確定">未確定</option>
              <option value="的中">的中</option>
              <option value="不的中">不的中</option>
            </select>
          </label>
        </div>
      </section>

      <section class="ticket-summary-section" aria-labelledby="ticket-summary-title">
        <h2 id="ticket-summary-title">券種別成績</h2>
        <div id="ticket-summary-list" class="ticket-summary-list"></div>
      </section>

      <div id="empty-message" class="empty-message">
        まだ買い目が登録されていません。
      </div>

      <div id="bet-list" class="bet-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</body>
</html>
